apiVersion: batch/v1
kind: Job
metadata:
  name: smallokr-registry-check
  namespace: alisa-infra
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: check
        image: maven:3.9.9-eclipse-temurin-17
        command:
        - sh
        - -ec
        args:
        - "echo NODE_REGISTRY_CA_INSPECTION\nfind /node-certs -type f -name hosts.toml\
          \ -exec grep -E '^[[:space:]]*(ca|skip_verify|server)[[:space:]]*=' {} \\\
          ; || true\nfind /node-certs -type f \\( -name '*.crt' -o -name '*.pem' \\\
          ) ! -iname '*key*' | while IFS= read -r f; do\n if openssl x509 -in \"$f\"\
          \ -noout >/dev/null 2>&1; then\n  echo \"PUBLIC_CERTIFICATE $f\"\n  openssl\
          \ x509 -in \"$f\" -noout -subject -issuer -fingerprint -sha256\n  openssl\
          \ x509 -in \"$f\" -outform PEM\n fi\ndone\n"
        volumeMounts:
        - name: certificates
          mountPath: /node-certs
          readOnly: true
      volumes:
      - name: certificates
        hostPath:
          path: /etc/containerd/certs.d
          type: Directory
