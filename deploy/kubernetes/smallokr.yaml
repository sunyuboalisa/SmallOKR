apiVersion: v1
kind: Secret
metadata:
  name: smallokr-targetservice-env
  namespace: alisa-infra
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-5'
type: Opaque
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallokr-targetservice
  namespace: alisa-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smallokr-targetservice
  template:
    metadata:
      labels:
        app: smallokr-targetservice
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: alisa-registry
      containers:
      - name: targetservice
        image: registry.kind.internal:5000/smallokr:git-66611a515ad535cb0c83ce291c065e1f7c859c8f-common03f0644ea91b
        command:
        - java
        args:
        - -XX:MaxRAMPercentage=70
        - -jar
        - /app/smallokr/targetservice-0.0.1-SNAPSHOT.jar
        ports:
        - name: http
          containerPort: 9081
        envFrom:
        - configMapRef:
            name: alisa-nacos
        - secretRef:
            name: alisa-jwt
        - secretRef:
            name: smallokr-targetservice-env
        env:
        - name: SPRING_CLOUD_NACOS_DISCOVERY_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 768Mi
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: target-service
  namespace: alisa-infra
spec:
  selector:
    app: smallokr-targetservice
  ports:
  - name: http
    port: 9081
    targetPort: http
---
